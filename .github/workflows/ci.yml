name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

# A new push to the same branch or PR makes the previous run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Everything runs this. dev asks for working, clean code - nothing more.
  verify:
    name: verify chain
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Python version comes from .python-version; no separate setup-python.
      - name: Install dependencies
        run: uv sync --all-groups --all-extras --frozen

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format
        run: uv run ruff format --check src/ tests/

      - name: Types
        run: uv run pyright src/intelliant

      # Coverage threshold (fail_under) lives in pyproject, not here, so the
      # local run and CI cannot disagree about it.
      - name: Tests
        run: uv run pytest tests/ --cov

  # main holds what gets published, so it is held to release readiness rather
  # than to "it works". These are the checks the release checklist used to
  # carry by hand, and they are the same ones release.yml runs before it
  # builds - a green main means a tag would not surprise anyone.
  release-gate:
    name: release gate
    needs: verify
    if: github.ref_name == 'main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --all-extras --frozen

      # Beyond the D rules that run on every branch: DOC verifies that
      # Args/Returns/Raises actually match the signature and body. Preview-only,
      # so it is not in the pyproject select list; DOC502 is skipped because it
      # reports a function raising through a helper as an extraneous exception.
      - name: Docstring contract
        run: uv run ruff check --select DOC --ignore DOC502 --preview src/

      # Excluded from the default run by a marker, so nothing else would ever
      # execute it; on a library whose selling point is scale, an unrun scale
      # test rots quietly.
      - name: Scale test
        run: uv run pytest tests/ -m slow

      - name: Dependency hygiene
        run: uv run deptry .

      # pyproject, __init__ and CITATION.cff are all listed in commitizen's
      # version_files, so cz bump keeps them in step. This checks that nobody
      # edited one by hand: a release would otherwise ship one number, report
      # another, and hand out a citation for a third.
      - name: Version consistency
        run: |
          project=$(uv run python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          module=$(uv run python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/intelliant/__init__.py').read_text()).group(1))")
          citation=$(uv run python -c "import re,pathlib; print(re.search(r'^version: (.+)$', pathlib.Path('CITATION.cff').read_text(), re.M).group(1))")
          echo "pyproject=$project __init__=$module CITATION.cff=$citation"
          test "$project" = "$module"
          test "$project" = "$citation"

      # Building is not enough: a wheel can build and still be unimportable
      # because a file was left out of the package.
      - name: Build and install into a clean environment
        run: |
          uv build
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "import intelliant; print(intelliant.__version__); print(sorted(n for n in dir(intelliant) if not n.startswith('_')))"
