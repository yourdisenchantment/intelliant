# .pre-commit-config.yaml
#
# Mechanical checks only. Everything about the SUBSTANCE of a change - one
# concern per commit, the "why" in the body, no repeated subjects - is checked
# by the maintainer reading the draft in tmp/commits/ before the commit is
# made. Automating judgement produces false positives and teaches people to
# reach for --no-verify.

exclude: "^results/"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-ast
      - id: check-merge-conflict
      # macOS and Windows are case-insensitive, Linux is not; a pair of files
      # differing only in case breaks a checkout on the others.
      - id: check-case-conflict
      # A .env lives in the working tree.
      - id: detect-private-key
      # The previous repository reached 425 MB because figures were committed
      # unnoticed. uv.lock is the largest legitimate file at ~440 KB.
      - id: check-added-large-files
        args: [ --maxkb=1000 ]
      # main holds the published state and receives merges, never direct
      # commits - a single direct edit there turns every release merge into a
      # conflict.
      - id: no-commit-to-branch
        args: [ --branch, main ]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [ --fix, --exit-non-zero-on-fix ]
        types: [ python ]
        files: \.(py|ipynb)$
      - id: ruff-format
        types: [ python ]
        files: \.(py|ipynb)$

  - repo: local
    hooks:
      - id: commitizen
        name: commitizen check
        entry: uv run cz check --allow-abort --commit-msg-file
        language: system
        stages: [ commit-msg ]

      # The one message rule worth automating: several models have worked on
      # this repository, so a trailer crediting one of them is wrong about who
      # produced the work. It was violated twice before, and unlike the other
      # commit rules it needs no interpretation.
      - id: no-attribution-trailer
        name: no attribution trailers
        language: pygrep
        entry: '(?i)^\s*(co-authored-by|signed-off-by)\s*:'
        stages: [ commit-msg ]

      # Verify chain (AGENTS.md "Pre-report order"): ruff runs per-commit
      # above; pyright and pytest run on push - too slow per commit, and a
      # skipped hook is worse than a slow one.
      - id: pyright
        name: pyright (src/intelliant)
        entry: uv run pyright src/intelliant
        language: system
        pass_filenames: false
        always_run: true
        stages: [ pre-push ]

      # Coverage lives here rather than in addopts so that running a single
      # test file locally is not gated by fail_under.
      - id: pytest
        name: pytest + coverage (default markers)
        entry: uv run pytest tests/ --cov
        language: system
        pass_filenames: false
        always_run: true
        stages: [ pre-push ]
